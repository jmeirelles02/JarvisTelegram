# Sobe Evolution API + Jarvis. Variáveis vêm do .env (veja .env.example).
services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  evolution:
    image: atendai/evolution-api:v2.2.3
    restart: always
    depends_on: [postgres, redis]
    ports:
      - "127.0.0.1:8080:8080"  # só localhost: use túnel SSH para ler o QR
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_APIKEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # o histórico já vive no banco do Jarvis; não duplicar aqui
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://jarvis:8000/webhook/${WEBHOOK_TOKEN}
      WEBHOOK_GLOBAL_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes:
      - evolution_instances:/evolution/instances  # sessão do WhatsApp: sem isso o QR cai a cada restart

  jarvis:
    build: .
    restart: always
    depends_on: [evolution]
    env_file: .env
    environment:
      JARVIS_CHANNEL: whatsapp
      EVOLUTION_URL: http://evolution:8080
      PORT: "8000"
    # sem 'ports': o webhook só é alcançável pela rede interna do compose

volumes:
  postgres_data:
  redis_data:
  evolution_instances:
